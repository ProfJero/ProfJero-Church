<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Christian Worship Centre</title>
    <meta name="description" content="Christian Worship Centre — church management and member app. Devotionals, events, giving, prayer and pastoral care." />
    <meta name="author" content="ProfJero" />
    <meta name="generator" content="Crafted by ProfJero" />
    <meta name="theme-color" content="#1e3a8a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CWC" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="author" href="/humans.txt" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('cwc-theme') || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
      } catch (e) {}
    </script>
    <style>
      html { background: #f7f7f8; color: #18181b; }
      html.dark { background: #0a0d16; color: #eceef3; }
      .splash-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; opacity: .8; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Painted instantly while the app loads; replaced when React mounts. -->
      <div style="min-height:100dvh;display:grid;place-items:center;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
          <img src="/icons/icon-192.png" width="72" height="72" alt="" style="border-radius:18px;box-shadow:0 8px 24px rgb(30 58 138/.25)" />
          <div class="splash-name">Christian Worship Centre</div>
        </div>
      </div>
    </div>
    <noscript>Christian Worship Centre needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
