<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | RGCI Church Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Dropdown Styles */
        .user-dropdown {
            position: relative;
            display: inline-block;
        }
        .user-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            min-width: 180px;
            background-color: white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-radius: 12px;
            padding: 8px 0;
            z-index: 100;
            margin-top: 8px;
            border: 1px solid #f0e6f6;
        }
        .user-dropdown-content.show {
            display: block;
            animation: slideDown 0.2s ease-out;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .user-dropdown-content a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: #4a4a4a;
            text-decoration: none;
            transition: background 0.15s;
            font-size: 14px;
        }
        .user-dropdown-content a:hover {
            background-color: #f3e8ff;
        }
        .user-dropdown-content a i {
            width: 18px;
            color: #6a1b9a;
        }
        .user-dropdown-content .dropdown-divider {
            height: 1px;
            background: #f0e6f6;
            margin: 4px 0;
        }
        .user-dropdown-content .logout-item {
            color: #dc2626;
        }
        .user-dropdown-content .logout-item i {
            color: #dc2626;
        }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6a1b9a, #9c4dcc);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 16px;
        }
        .user-avatar:hover {
            transform: scale(1.05);
        }

        /* Button Loading States */
        .btn-loading {
            position: relative;
            pointer-events: none;
            opacity: 0.7;
        }
        .btn-loading .btn-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        .btn-loading .btn-text {
            opacity: 0.7;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .nav-item {
            transition: all 0.2s ease;
        }
        .nav-item.active {
            background: linear-gradient(135deg, #6a1b9a, #9c4dcc);
            color: white;
        }
        .nav-item.active i {
            color: white !important;
        }
        .nav-item:hover:not(.active) {
            background-color: #f3e8ff;
        }
        .sidebar {
            transition: transform 0.3s ease-in-out;
        }
        .sidebar.active {
            transform: translateX(0) !important;
        }
        .mobile-menu-btn {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 50;
            background: #6a1b9a;
            color: white;
            padding: 0.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        @media (min-width: 1024px) {
            .mobile-menu-btn { display: none; }
        }
    </style>
</head>
<body class="bg-[#f8f4fc]">

    <!-- Mobile Menu Toggle -->
    <button id="mobileMenuToggle" class="mobile-menu-btn lg:hidden">
        <i class="fas fa-bars text-xl"></i>
    </button>

    <!-- Mobile Overlay -->
    <div id="mobileOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden lg:hidden"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar fixed left-0 top-0 h-full w-72 bg-white shadow-2xl z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out overflow-y-auto">
        <div class="p-6 border-b border-purple-100">
            <div class="flex items-center gap-3">
                <img src="images/rgci-logo.png" alt="RGCI Official Logo" width="50px">
                <div>
                    <h2 class="font-bold text-gray-800 text-lg">RGCI</h2>
                    <p class="text-xs text-gray-500">Ekklesia Management Suite</p>
                </div>
            </div>
        </div>
        
        <nav class="p-4 space-y-1" id="mainNav">
            <!-- Nav items will be dynamically generated -->
        </nav>
        
        <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-purple-100 bg-white">
            <div class="text-center">
                <p class="text-xs text-gray-400">
                    <i class="fas fa-shield-alt mr-1"></i> Secured System
                </p>
                <p class="text-[10px] text-gray-300 mt-1">Powered by Digital Bridge Initiative</p>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="lg:ml-72 min-h-screen">
        <!-- Top Header -->
        <div class="bg-white shadow-sm sticky top-0 z-20">
            <div class="px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <div class="hidden lg:block">
                    <h1 class="text-xl font-bold bg-gradient-to-r from-[#5a1a7a] to-[#9b4dca] bg-clip-text text-transparent">
                        Restoration Grace Chapel International
                    </h1>
                    <p class="text-xs text-gray-500">User Management</p>
                </div>
                <div class="flex items-center gap-3 ml-auto lg:ml-0">
                    <div id="userDisplay"></div>
                    <div class="bg-gradient-to-r from-[#6a1b9a] to-[#9c4dcc] text-white px-4 py-2 rounded-full text-sm font-semibold shadow-md">
                        <i class="fas fa-dove mr-2"></i> RGCI
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Content -->
        <div class="p-4 sm:p-6 lg:p-8">
            <!-- Add User Form -->
            <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
                <h2 class="text-xl font-bold text-[#6a1b9a] mb-4 flex items-center gap-2">
                    <i class="fas fa-user-plus"></i> Create New User Account
                </h2>
                
                <form id="userForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                            <input type="text" id="fullName" required 
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6a1b9a] focus:border-transparent"
                                placeholder="Enter full name">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
                            <input type="email" id="email" required 
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6a1b9a] focus:border-transparent"
                                placeholder="user@rgci.org">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                            <input type="tel" id="phone" 
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6a1b9a] focus:border-transparent"
                                placeholder="+233 XX XXX XXXX">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                            <input type="text" id="department" 
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6a1b9a] focus:border-transparent"
                                placeholder="e.g., Worship, Admin, Youth">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">User Role *</label>
                            <select id="role" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6a1b9a]">
                                <option value="">Select Role</option>
                                <option value="super_admin">Super Admin (Full Access)</option>
                                <option value="pastor">Pastor (All except User Management)</option>
                                <option value="treasurer">Treasurer (Finance Only)</option>
                                <option value="secretary">Secretary (Attendance Only)</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Temporary Password *</label>
                            <input type="password" id="password" required 
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6a1b9a] focus:border-transparent"
                                placeholder="Min. 6 characters">
                            <p class="text-xs text-gray-400 mt-1">User can change password after first login</p>
                        </div>
                    </div>
                    
                    <div class="flex gap-3 flex-wrap">
                        <button type="submit" id="createUserBtn" 
                            class="bg-[#6a1b9a] text-white px-6 py-2 rounded-lg font-semibold hover:bg-[#8e35c4] transition">
                            <i class="fas fa-save mr-2"></i> <span class="btn-text">Create User</span>
                        </button>
                        <button type="reset" 
                            class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-semibold hover:bg-gray-300 transition">
                            <i class="fas fa-undo mr-2"></i> Clear
                        </button>
                    </div>
                </form>
            </div>

            <!-- Users List -->
            <div class="bg-white rounded-2xl shadow-xl p-6">
                <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
                    <h2 class="text-xl font-bold text-[#6a1b9a] flex items-center gap-2">
                        <i class="fas fa-users-cog"></i> System Users
                    </h2>
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" placeholder="Search users..." 
                            class="px-3 py-2 border border-gray-300 rounded-lg w-64 text-sm focus:ring-2 focus:ring-[#6a1b9a]">
                        <button id="refreshUsersBtn" class="bg-gray-100 text-gray-700 px-3 py-2 rounded-lg hover:bg-gray-200 transition">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
                
                <div id="usersList" class="overflow-x-auto">
                    <div class="text-center py-8 text-gray-400">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>
                        Loading users...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-5 left-1/2 transform -translate-x-1/2 z-50 bg-gray-800 text-white px-5 py-2 rounded-full shadow-lg text-sm"></div>

    <script type="module" src="js/users.js"></script>
</body>
</html>
