<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RGCI Church Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #6a1b9a 0%, #9c4dcc 50%, #e8d5f5 100%);
            min-height: 100vh;
        }
        .login-card {
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #6a1b9a;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-loading {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white bg-opacity-20 rounded-2xl backdrop-blur-sm mb-4">
                <img src="images/rgci-logo.png" alt="RGCI Official Logo" style="width: 60px; height: 60px; object-fit: contain;">
            </div>
            <h1 class="text-3xl font-bold text-white">Restoration Grace</h1>
            <p class="text-purple-100 mt-1">Chapel International</p>
            <p class="text-xs text-purple-200 mt-2">Church Management System</p>
        </div>

        <div class="login-card bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-gradient-to-br from-[#6a1b9a] to-[#9c4dcc] rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-lock text-2xl text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Administrator Login</h2>
                <p class="text-gray-500 text-sm mt-1">Sign in to manage church operations</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-envelope mr-2 text-[#6a1b9a]"></i>Email Address
                    </label>
                    <input type="email" id="email" required 
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#6a1b9a] focus:border-transparent transition"
                        placeholder="admin@rgci.org">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-key mr-2 text-[#6a1b9a]"></i>Password
                    </label>
                    <input type="password" id="password" required 
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#6a1b9a] focus:border-transparent transition"
                        placeholder="••••••••">
                </div>

                <button type="submit" id="loginBtn" 
                    class="w-full bg-gradient-to-r from-[#6a1b9a] to-[#9c4dcc] text-white py-3 rounded-xl font-semibold hover:shadow-lg transition-all transform hover:scale-[1.02]">
                    <i class="fas fa-sign-in-alt mr-2"></i> Sign In
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-xs text-center text-gray-400">
                    <i class="fas fa-shield-alt mr-1"></i> Secured Access | Authorized Personnel Only
                </p>
            </div>
        </div>

        <div class="text-center mt-6 text-white text-opacity-70 text-xs">
            <p>Powered by Digital Bridge Initiative | Ekklesia by ProfJero</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-5 left-1/2 transform -translate-x-1/2 z-50 bg-gray-800 text-white px-5 py-3 rounded-xl shadow-lg text-sm font-medium"></div>

    <script type="module">
        import { loginUser, showToast } from './js/auth.js';
        import { auth, onAuthStateChanged } from './js/firebase-config.js';

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is already logged in, redirect to dashboard
                window.location.href = 'dashboard.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // Validate inputs
            if (!email || !password) {
                showToast('Please enter both email and password', 'error');
                return;
            }
            
            // Show loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner mr-2"></span> Signing in...';
            btn.classList.add('btn-loading');
            
            try {
                const result = await loginUser(email, password);
                
                if (!result.success) {
                    // Reset button
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Sign In';
                    btn.classList.remove('btn-loading');
                }
                // If success, redirect happens in loginUser
            } catch (error) {
                console.error('Login error:', error);
                showToast('An unexpected error occurred. Please try again.', 'error');
                
                // Reset button
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Sign In';
                btn.classList.remove('btn-loading');
            }
        });

        // Add Enter key support
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
