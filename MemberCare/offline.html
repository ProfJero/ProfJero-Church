<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - RGCI Member Care</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #12002c 0%, #2d1052 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: #f9bd22;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .btn-retry {
            background: #6b38d4;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(107, 56, 212, 0.3);
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(107, 56, 212, 0.4);
        }
        .btn-retry:active {
            transform: scale(0.97);
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .feature-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .feature-item i {
            display: block;
            font-size: 20px;
            margin-bottom: 4px;
            color: #f9bd22;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <i class="fas fa-wifi"></i>
        </div>
        <h1>You're Offline</h1>
        <p>
            <span class="status-dot"></span>
            No internet connection detected
        </p>
        <p style="font-size: 13px; opacity: 0.6; margin-bottom: 20px;">
            Don't worry! Your previously loaded content is still available.
        </p>
        
        <div class="features">
            <div class="feature-item">
                <i class="fas fa-hands-praying"></i>
                Prayer Requests
            </div>
            <div class="feature-item">
                <i class="fas fa-book-bible"></i>
                Devotions
            </div>
            <div class="feature-item">
                <i class="fas fa-calendar-alt"></i>
                Events
            </div>
            <div class="feature-item">
                <i class="fas fa-user"></i>
                Profile
            </div>
        </div>
        
        <button class="btn-retry" onclick="retryConnection()">
            <i class="fas fa-sync-alt"></i>
            Retry Connection
        </button>
        
        <p style="font-size: 12px; opacity: 0.4; margin-top: 20px;">
            Once you're back online, everything will sync automatically.
        </p>
    </div>

    <script>
        function retryConnection() {
            if (navigator.onLine) {
                window.location.href = '/index.html';
            } else {
                // Check again after 2 seconds
                setTimeout(() => {
                    if (navigator.onLine) {
                        window.location.href = '/index.html';
                    } else {
                        alert('Still offline. Please check your connection and try again.');
                    }
                }, 2000);
            }
        }
        
        // Listen for online status change
        window.addEventListener('online', () => {
            window.location.href = '/index.html';
        });
    </script>
</body>
</html>
