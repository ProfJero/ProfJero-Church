<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>RGCI - Events</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6b38d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RGCI Care">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

    <!-- PWA Script -->
    <script src="/pwa.js"></script>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "surface-container": "#edeeef",
                        "inverse-surface": "#2e3132",
                        "on-tertiary-fixed": "#261a00",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "primary-fixed-dim": "#d7baff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#d0bcff",
                        "tertiary-container": "#2d1f00",
                        "surface-container-highest": "#e1e3e4",
                        "on-surface": "#191c1d",
                        "tertiary-fixed-dim": "#f9bd22",
                        "tertiary": "#100900",
                        "outline": "#7b7580",
                        "on-secondary-fixed-variant": "#5516be",
                        "surface-container-high": "#e7e8e9",
                        "primary-container": "#2d1052",
                        "on-background": "#191c1d",
                        "inverse-primary": "#d7baff",
                        "surface-dim": "#d9dadb",
                        "primary-fixed": "#eddcff",
                        "on-secondary-container": "#fffbff",
                        "secondary-fixed": "#e9ddff",
                        "surface": "#f8f9fa",
                        "secondary-container": "#8455ef",
                        "on-secondary-fixed": "#23005c",
                        "outline-variant": "#ccc4d0",
                        "secondary": "#6b38d4",
                        "on-primary": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "background": "#f8f9fa",
                        "tertiary-fixed": "#ffdf9f",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#ae8200",
                        "surface-tint": "#6d5194",
                        "inverse-on-surface": "#f0f1f2",
                        "on-surface-variant": "#4a454f",
                        "primary": "#12002c",
                        "on-primary-fixed": "#27084c",
                        "on-primary-fixed-variant": "#54397a",
                        "on-primary-container": "#997bc2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "unit": "4px",
                        "gutter-card": "12px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "margin-page": "20px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["13px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "body-sm": ["12px", {"lineHeight": "18px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-effect {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #191c1d;
            padding-bottom: 90px;
        }
        .event-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(107, 56, 212, 0.1);
        }
        .event-card:active {
            transform: scale(0.98);
        }
        
        /* Toast Styles */
        .toast-container {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
        }
        .toast-message {
            padding: 14px 24px;
            border-radius: 16px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s ease-out;
            text-align: center;
        }
        .toast-success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast-error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast-info { background: linear-gradient(135deg, #6b38d4, #7c3aed); }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Glass Navbar Styles */
        .glass-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 
                0 4px 30px rgba(107, 56, 212, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(107, 56, 212, 0.08);
            padding: 8px 20px;
            width: auto;
            min-width: 200px;
            max-width: 90%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 90px;
        }
        .glass-nav::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 30%;
            right: 30%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6b38d4, #a78bfa, #6b38d4, transparent);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
            border-radius: 2px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .glass-nav::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(107, 56, 212, 0.05), transparent);
            z-index: -1;
            filter: blur(10px);
        }
        
        .nav-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 6px 14px;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-width: 56px;
        }
        .nav-item:hover {
            background: rgba(107, 56, 212, 0.06);
            transform: translateY(-1px);
        }
        .nav-item.active {
            color: #6b38d4;
            font-weight: 600;
        }
        .nav-item.active .nav-indicator {
            display: block;
        }
        .nav-item.active .nav-glow {
            opacity: 1;
        }
        .nav-item i {
            font-size: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item:hover i {
            transform: scale(1.1) translateY(-1px);
        }
        .nav-item.active i {
            transform: scale(1.05);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .nav-glow {
            position: absolute;
            inset: -2px -4px;
            border-radius: 14px;
            background: radial-gradient(ellipse at center, rgba(107, 56, 212, 0.12) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }
        .nav-item.active .nav-glow {
            opacity: 1;
            animation: glowPulse 2s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.08); }
        }
        .nav-indicator {
            display: none;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6b38d4, #a78bfa);
            margin-top: 1px;
            box-shadow: 0 0 12px rgba(107, 56, 212, 0.4);
            animation: indicatorPulse 2s ease-in-out infinite;
        }
        @keyframes indicatorPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(107, 56, 212, 0.4); }
            50% { box-shadow: 0 0 20px rgba(107, 56, 212, 0.7); }
        }
        
        @media (max-width: 640px) {
            .glass-nav {
                padding: 6px 30px;
                min-width: 160px;
                bottom: 12px;
                gap: 30px;
            }
            .nav-item {
                padding: 4px 10px;
                min-width: 44px;
            }
            .nav-item i {
                font-size: 18px;
            }
            .nav-item span {
                font-size: 10px;
            }
        }
        
        /* Category Filter Active State */
        .filter-btn.active {
            background: #6b38d4;
            color: white;
            box-shadow: 0 4px 16px rgba(107, 56, 212, 0.3);
        }
        .filter-btn:not(.active) {
            background: #edeeef;
            color: #4a454f;
        }
        .filter-btn:not(.active):hover {
            background: #e1e3e4;
        }
        
        /* Loading Spinner */
        .loading-spinner {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Event Details Modal */
        .modal-container {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: none;
        }
        .modal-container.active {
            display: block;
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .modal-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 28px 28px 0 0;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px;
            padding-bottom: 32px;
            z-index: 9999;
        }
        .modal-content::-webkit-scrollbar {
            width: 4px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #6b38d4;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen">

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container hidden"></div>

    <!-- Event Details Modal -->
    <div id="eventDetailModal" class="modal-container">
        <div class="modal-overlay absolute inset-0" onclick="closeEventModal()"></div>
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-primary"><i class="fas fa-calendar-alt text-secondary mr-2"></i>Event Details</h3>
                <button onclick="closeEventModal()" class="text-gray-400 hover:text-gray-600 text-xl w-8 h-8 rounded-full hover:bg-gray-100 transition flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="eventDetailContent">
                <!-- Will be populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Top App Bar -->
    <header class="bg-background/85 backdrop-blur-md flex justify-between items-center px-margin-page w-full h-16 sticky top-0 z-50 transition-all duration-300">
        <div class="flex flex-col">
            <h1 class="font-headline-md text-headline-md font-bold text-primary">Events</h1>
            <p class="font-label-md text-label-md text-on-surface-variant">Stay connected. Stay involved.</p>
        </div>
        <div class="flex gap-2">
            <button id="searchBtn" class="p-2 hover:bg-surface-variant/50 rounded-full transition-transform active:scale-95">
                <i class="fas fa-search text-primary text-xl"></i>
            </button>
            <div class="relative">
                <button id="notificationBtn" class="p-2 hover:bg-surface-variant/50 rounded-full transition-transform active:scale-95">
                    <i class="fas fa-bell text-primary text-xl"></i>
                </button>
                <span id="notificationBadge" class="absolute top-2 right-2 w-2.5 h-2.5 bg-tertiary-fixed-dim rounded-full border-2 border-background hidden"></span>
            </div>
        </div>
    </header>

    <main class="space-y-stack-lg mt-stack-md">
        <!-- Hero Featured Section -->
        <section class="px-margin-page">
            <div id="featuredEventContainer" class="relative overflow-hidden rounded-[2rem] h-[260px] shadow-lg group">
                <!-- Will be populated dynamically -->
                <div class="absolute inset-0 z-0 bg-cover bg-center" id="featuredImage"></div>
                <div class="absolute inset-0 bg-gradient-to-r from-primary-container via-primary-container/80 to-transparent z-10"></div>
                <div class="relative z-20 p-6 h-full flex flex-col justify-between text-white">
                    <div class="flex justify-between items-start">
                        <span class="bg-primary/40 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 border border-white/20">
                            <i class="fas fa-star text-[10px]"></i>
                            Featured
                        </span>
                        <button id="featuredBookmarkBtn" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center hover:bg-white/30 transition-colors">
                            <i class="far fa-bookmark text-white"></i>
                        </button>
                    </div>
                    <div class="space-y-2">
                        <div class="flex items-center gap-2 mb-1">
                            <div class="w-8 h-8 rounded-full bg-tertiary-fixed flex items-center justify-center">
                                <i class="fas fa-church text-primary text-sm"></i>
                            </div>
                            <span class="font-bold text-tertiary-fixed tracking-tight">RGCI</span>
                        </div>
                        <h2 id="featuredTitle" class="font-headline-lg-mobile text-headline-lg-mobile leading-tight max-w-[220px]">Loading...</h2>
                        <p id="featuredSubtitle" class="text-tertiary-fixed font-label-md text-label-md italic">Loading...</p>
                        <div id="featuredDetails" class="flex flex-wrap gap-4 mt-2 text-[11px] opacity-90">
                            <div class="flex items-center gap-1">
                                <i class="fas fa-calendar-alt text-sm"></i>
                                <span id="featuredDate">Loading...</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <i class="fas fa-location-dot text-sm"></i>
                                <span id="featuredLocation">Loading...</span>
                            </div>
                        </div>
                    </div>
                    <button id="featuredViewBtn" class="mt-2 self-start bg-secondary-container hover:bg-secondary text-on-secondary px-6 py-2 rounded-full font-label-md transition-all active:scale-95 shadow-md">
                        View Event
                    </button>
                </div>
            </div>
        </section>

        <!-- Category Filters -->
        <section class="px-margin-page">
            <div class="flex gap-stack-sm overflow-x-auto hide-scrollbar pb-2">
                <button class="filter-btn active px-5 py-2 rounded-full font-label-md text-label-md transition-all" data-filter="all">All</button>
                <button class="filter-btn px-5 py-2 rounded-full font-label-md text-label-md transition-all" data-filter="worship">Worship</button>
                <button class="filter-btn px-5 py-2 rounded-full font-label-md text-label-md transition-all" data-filter="conference">Conferences</button>
                <button class="filter-btn px-5 py-2 rounded-full font-label-md text-label-md transition-all" data-filter="youth">Youth</button>
                <button class="filter-btn px-5 py-2 rounded-full font-label-md text-label-md transition-all" data-filter="campus">Campus</button>
                <button class="filter-btn px-5 py-2 rounded-full font-label-md text-label-md transition-all" data-filter="teaching">Teaching</button>
            </div>
        </section>

        <!-- Upcoming Events Grid -->
        <section class="space-y-stack-md">
            <div class="px-margin-page flex justify-between items-end">
                <h3 class="font-headline-sm text-headline-sm text-primary">Upcoming Events</h3>
                <button class="text-secondary font-label-md text-label-md flex items-center gap-1">
                    View Calendar <i class="fas fa-calendar-alt text-sm"></i>
                </button>
            </div>
            <div id="eventsGrid" class="flex gap-gutter-card overflow-x-auto px-margin-page hide-scrollbar pb-2">
                <!-- Events will be loaded dynamically -->
                <div class="text-center py-8 text-gray-400 w-full">
                    <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>
                    Loading events...
                </div>
            </div>
        </section>

        <!-- Calendar & My Events Row -->
        <section class="px-margin-page grid grid-cols-1 md:grid-cols-2 gap-stack-lg">
            <!-- Calendar Widget -->
            <div class="bg-white rounded-3xl p-6 shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-surface-variant/20 flex flex-col h-full">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-headline-sm text-headline-sm text-primary">Event Calendar</h3>
                    <i class="fas fa-chevron-right text-outline"></i>
                </div>
                <div class="grid grid-cols-7 gap-1 mb-8" id="calendarGrid">
                    <!-- Calendar days will be rendered by JS -->
                </div>
                <div id="calendarEvents" class="space-y-4 flex-grow">
                    <!-- Events for selected day -->
                </div>
                <button class="mt-6 text-secondary text-sm font-bold flex items-center gap-1 group">
                    See Full Calendar 
                    <i class="fas fa-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>

            <!-- Side Bento Column -->
            <div class="space-y-stack-lg">
                <!-- Registration Reminder Card -->
                <div id="upcomingReminder" class="bg-primary-container text-on-primary-container p-5 rounded-3xl relative overflow-hidden group shadow-lg shadow-primary-container/10">
                    <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-white/5 rounded-full blur-2xl group-hover:scale-125 transition-transform duration-700"></div>
                    <div class="relative z-10 flex flex-col gap-3">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-bell text-tertiary-fixed text-lg"></i>
                            <span class="text-[10px] font-bold uppercase tracking-widest text-on-primary-container/80">Upcoming</span>
                        </div>
                        <h4 id="reminderTitle" class="font-headline-sm text-headline-sm text-white">Loading...</h4>
                        <p id="reminderDate" class="text-sm text-white/70">Loading...</p>
                        <button id="reminderViewBtn" class="mt-1 bg-white/10 hover:bg-white/20 backdrop-blur-md text-white py-2 rounded-xl text-sm font-bold transition-all border border-white/10 active:scale-95">
                            View Event
                        </button>
                    </div>
                </div>

                <!-- My Events List -->
                <div class="bg-white rounded-3xl p-6 shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-surface-variant/20">
                    <div class="flex justify-between items-center mb-5">
                        <h3 class="font-headline-sm text-headline-sm text-primary">My Events</h3>
                        <button id="viewAllMyEvents" class="text-secondary font-label-md text-label-md flex items-center gap-1">
                            View All <i class="fas fa-chevron-right text-sm"></i>
                        </button>
                    </div>
                    <div id="myEventsList" class="space-y-4">
                        <!-- My events will be loaded dynamically -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Past Events Section -->
        <section class="space-y-stack-md pb-6">
            <div class="px-margin-page flex justify-between items-end">
                <h3 class="font-headline-sm text-headline-sm text-primary">Past Events</h3>
                <button class="text-secondary font-label-md text-label-md flex items-center gap-1">
                    View All Recaps <i class="fas fa-chevron-right text-sm"></i>
                </button>
            </div>
            <div id="pastEventsList" class="flex gap-4 overflow-x-auto px-margin-page hide-scrollbar pb-2">
                <!-- Past events will be loaded dynamically -->
            </div>
        </section>
    </main>

    <!-- Glass Navigation Bar -->
    <nav class="glass-nav">
        <button onclick="window.location.href='index.html'" class="nav-item">
            <i class="fas fa-hands-helping"></i>
            <span>Care</span>
            <span class="nav-indicator"></span>
            <span class="nav-glow"></span>
        </button>
        
        <button onclick="window.location.href='events.html'" class="nav-item active">
            <i class="fas fa-calendar-alt"></i>
            <span>Events</span>
            <span class="nav-indicator"></span>
            <span class="nav-glow"></span>
        </button>
        
        <button onclick="window.location.href='profile.html'" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
            <span class="nav-indicator"></span>
            <span class="nav-glow"></span>
        </button>
    </nav>

    <script type="module" src="events.js"></script>
</body>
</html>
